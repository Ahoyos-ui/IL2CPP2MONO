name: Build Unity Mono iOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Diagnostics
        run: |
          echo "===== Xcode ====="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode"
          xcode-select -p || true
          echo "===== workspace before checkout ====="
          ls -la

      - name: Checkout IL2CPP2MONO
        uses: actions/checkout@v4
        with:
          ref: Ahoyos

      - name: Checkout Unity Mono
        uses: actions/checkout@v4
        with:
          repository: Unity-Technologies/mono
          ref: unity-2022.3-mbe
          path: unity-mono
          fetch-depth: 1

      - name: Verify checkouts
        run: |
          echo "===== root ====="
          ls -la
          echo "===== unity-mono ====="
          ls unity-mono | head -30
          echo "===== mono/utils ====="
          ls unity-mono/mono/utils | head -30

      - name: Select newest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode found"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"

      - name: Install build dependencies
        run: brew install autoconf automake libtool pkg-config cmake ninja ldid

      - name: Copy JIT header into Mono tree
        run: |
          cp mono/Scripts/IOS-JIT.cpp unity-mono/mono/utils/mono-ios-jit.h
          ls -la unity-mono/mono/utils/mono-ios-jit.h

      - name: Apply iOS patches
        run: python3 mono/Scripts/IOS.py unity-mono

      - name: Build iOS ARM64 SGen runtime
        working-directory: unity-mono
        run: make -C sdks/builds package-ios-target64 ENABLE_IOS=1 CONFIGURATION=release

      - name: Verify JIT enabled
        working-directory: unity-mono
        run: |
          CONFIG=sdks/out/ios-target64-release/include/mono-2.0/mono/metadata/private/config.h
          test -f "$CONFIG" || { echo "config.h missing"; exit 1; }
          ! grep -q "define DISABLE_JIT" "$CONFIG" || { echo "JIT disabled"; exit 1; }
          echo "JIT verification passed."

      - name: Upload runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-2022.3-ios-arm64-sgen
          path: unity-mono/sdks/out/ios-target64-release/**
          retention-days: 14
