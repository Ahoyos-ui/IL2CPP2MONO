name: Build Unity Mono iOS ARM64

on:
  push:
    branches: [Ahoyos]
    paths:
      - 'mono/Scripts/**'
      - '.github/workflows/IOS.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout IL2CPP2MONO
        uses: actions/checkout@v4
        with:
          ref: Ahoyos

      - name: Checkout Unity Mono
        uses: actions/checkout@v4
        with:
          repository: Unity-Technologies/mono
          ref: unity-2022.3-mbe
          path: unity-mono

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config cmake ninja ldid

      - name: Copy JIT header into Mono tree
        run: |
          cp mono/Scripts/IOS-JIT.cpp unity-mono/mono/utils/mono-ios-jit.h

      - name: Apply iOS patches
        run: |
          python3 mono/Scripts/IOS.py unity-mono

      - name: Configure and build iOS ARM64 SGen runtime
        working-directory: unity-mono
        run: |
          make -C sdks/builds package-ios-target64 \
            ENABLE_IOS=1 \
            CONFIGURATION=release

      - name: Verify JIT is enabled
        working-directory: unity-mono
        run: |
          CONFIG=sdks/out/ios-target64-release/include/mono-2.0/mono/metadata/private/config.h
          if grep -q "define DISABLE_JIT" "$CONFIG"; then
            echo "ERROR: JIT is disabled in config.h"
            exit 1
          fi
          if grep -q "define DISABLE_ICALL_TABLES" "$CONFIG"; then
            echo "ERROR: icall tables are disabled"
            exit 1
          fi
          echo "JIT verification passed."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-build-log
          path: unity-mono/sdks/out/ios-target64-release/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Mono runtime
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-2022.3-ios-arm64-sgen
          path: unity-mono/sdks/out/ios-target64-release/**
          retention-days: 14
